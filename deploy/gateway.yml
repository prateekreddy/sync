# The agent gateway. Included by docker-compose.yml.
#
# Split out only so the file that deploys Plane stays readable; there is one
# stack, and whether it also deploys Plane is decided by PLANE_BASE_URL in .env.
#
# It reaches Plane over the `plane` network, which docker-compose.yml points
# either at the Plane it just deployed or at one that already exists.

services:
  # ── schema ───────────────────────────────────────────────────────────────
  #
  # Runs to completion, then exits. Migrations are kept out of the server's
  # startup path so a failed migration is loud and one-shot rather than a crash
  # loop that looks like a connectivity problem.
  #
  # Uses the stock postgres image rather than installing a client into ours: psql
  # is already there, the image is already pulled for plane-db, and it means the
  # gateway image needs no package manager at runtime.
  gateway-migrate:
    image: postgres:${POSTGRES_VERSION:-15.7}-alpine
    restart: "no"
    # No depends_on: when attaching to an existing Plane, plane-db is not part of
    # this project at all, and Compose rejects a dependency on a service that is
    # switched off by profiles. The wait loop below covers both modes.
    environment:
      PGHOST: ${PLANE_DB_HOST:-plane-db}
      PGPORT: ${POSTGRES_PORT:-5432}
      # 000_bootstrap.sql needs to CREATE ROLE and CREATE DATABASE, so it runs as
      # the instance superuser. 001_init.sql then runs as the least-privileged
      # role that owns the schema, which is also how it will run in production.
      SUPERUSER: ${POSTGRES_USER:-plane}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run ./gen-env.sh first}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?run ./gen-env.sh first}
    volumes:
      - ../server/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        printf 'waiting for postgres at %s:%s ' "$$PGHOST" "$$PGPORT"
        i=0
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$SUPERUSER" -q; do
          i=$$((i+1)); [ "$$i" -gt 60 ] && { echo " giving up"; exit 1; }
          printf '.'; sleep 2
        done
        echo " ready"
        echo "bootstrap: creating the agent_gw role and gateway database"
        psql -U "$$SUPERUSER" -d postgres -v ON_ERROR_STOP=1 -f /migrations/000_bootstrap.sql
        for f in /migrations/0*.sql; do
          case "$$f" in *000_bootstrap*) continue;; esac
          echo "applying $$(basename "$$f")"
          PGPASSWORD="$$GATEWAY_DB_PASSWORD" psql -U agent_gw -d gateway \
            -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "migrations applied"
    networks: [plane]

  # ── the gateway ──────────────────────────────────────────────────────────
  #
  # Behind the `gateway` profile because it cannot start until Plane has a
  # workspace and an API token, and those cannot exist until Plane is running.
  # ./provision.sh creates them and then adds `gateway` to COMPOSE_PROFILES in
  # .env, after which a plain `docker compose up -d` brings up everything.
  gateway:
    build:
      context: ../server
    profiles: ["gateway"]
    # Plane's webhook SSRF allowlist matches on hostname, so this name has to
    # agree with WEBHOOK_ALLOWED_HOSTS.
    hostname: gateway
    restart: unless-stopped
    environment:
      # Plane's Postgres, but a separate DATABASE. Postgres has no cross-database
      # queries, so the gateway cannot read Plane's tables even by accident, and
      # a stray GRANT later cannot quietly dissolve that boundary.
      GATEWAY_DATABASE_URL: postgres://agent_gw:${GATEWAY_DB_PASSWORD}@${PLANE_DB_HOST:-plane-db}:${POSTGRES_PORT:-5432}/gateway
      # Reached through Plane's own proxy so path routing matches what an external
      # client would get.
      PLANE_BASE_URL: ${PLANE_BASE_URL:-http://proxy}
      PLANE_API_KEY: ${PLANE_API_KEY}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG}
      # Encrypts stored per-agent Plane tokens. Lives here, never in a database:
      # the gateway and Plane databases share a Postgres instance and therefore a
      # backup, so a key kept beside the ciphertext would protect nothing.
      GATEWAY_TOKEN_KEY: ${GATEWAY_TOKEN_KEY:?run ./gen-env.sh first}
      ALLOW_AGENT_CLOSE: ${ALLOW_AGENT_CLOSE:-true}
      SWEEP_INTERVAL_MS: ${SWEEP_INTERVAL_MS:-30000}
      # Plane's own MCP server, hosted here rather than on the agent boxes — it
      # authenticates from the environment, so running it next to an agent would
      # mean handing that agent a Plane write credential. Set to `off` to serve
      # only the coordination tools.
      PLANE_MCP: ${PLANE_MCP:-on}
      PLANE_MCP_IDLE_MS: ${PLANE_MCP_IDLE_MS:-600000}
      PLANE_MCP_MAX_SESSIONS: ${PLANE_MCP_MAX_SESSIONS:-24}
      # Self-service onboarding: anyone in the workspace exchanges their own Plane
      # personal token for an agent token, so nobody needs a shell here. The
      # exchange only reduces privilege (see server/src/mint.ts), which is why it
      # carries no admin gate. Set to `off` to issue exclusively from the CLI.
      # off | warn | refuse. warn records a completion citing nothing checkable
      # and labels the item "unverified"; refuse rejects the call.
      REQUIRE_EVIDENCE: ${REQUIRE_EVIDENCE:-warn}
      MINT_TOKENS: ${MINT_TOKENS:-on}
      # Per source address. This endpoint takes no gateway credential and calls
      # Plane twice per request, so an unthrottled one lets a stranger burn the
      # workspace's rate-limit budget and take the whole fleet down with it.
      MINT_RATE_LIMIT: ${MINT_RATE_LIMIT:-10}
      # How agents reach this gateway from outside, e.g. https://mcp.example.dev.
      # Required behind a reverse proxy that does not send X-Forwarded-Proto and
      # X-Forwarded-Host: the OAuth issuer and every advertised endpoint are built
      # from it, and a wrong value sends clients somewhere nothing is listening.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
      # Only used to link to Plane's token page from the sign-in screen.
      WEB_URL: ${WEB_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8787
    ports:
      # Agent boxes dial in here. Put this behind TLS before exposing it beyond a
      # trusted network — agent tokens are bearer credentials.
      - "${GATEWAY_LISTEN_PORT:-8787}:8787"
    networks: [plane]
    depends_on:
      gateway-migrate:
        # Wait for migrations to COMPLETE, not merely to start, or the server can
        # boot against a schema that is not there yet.
        condition: service_completed_successfully
