# The agent gateway, joined to Plane's existing compose network.
#
#   docker compose -f deploy/docker-compose.gateway.yml --env-file deploy/gateway.env up -d
#
# Runs alongside Plane rather than inside its compose file, so a `setup.sh upgrade`
# (which regenerates Plane's docker-compose.yaml) cannot clobber it.

name: sync-gateway

services:
  gateway:
    build:
      context: ../server
    # Plane's webhook SSRF allowlist matches on hostname, so this name has to
    # agree with WEBHOOK_ALLOWED_HOSTS in plane.env.
    hostname: gateway
    restart: unless-stopped
    environment:
      # Plane's Postgres, but a separate DATABASE. Postgres has no cross-database
      # queries, so the gateway cannot read Plane's tables even by accident.
      GATEWAY_DATABASE_URL: postgres://agent_gw:${GATEWAY_DB_PASSWORD}@plane-db:5432/gateway
      # Reach Plane through its own proxy so path routing matches what an external
      # client would get.
      PLANE_BASE_URL: http://proxy
      PLANE_API_KEY: ${PLANE_API_KEY}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG}
      # Encrypts stored per-agent Plane tokens. Lives here, never in a database:
      # the gateway and Plane databases share a Postgres instance and a backup, so
      # a key kept alongside the ciphertext would protect nothing.
      GATEWAY_TOKEN_KEY: ${GATEWAY_TOKEN_KEY}
      ALLOW_AGENT_CLOSE: ${ALLOW_AGENT_CLOSE:-true}
      SWEEP_INTERVAL_MS: ${SWEEP_INTERVAL_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8787
    ports:
      # Agent boxes dial in here. Put this behind TLS before exposing it beyond a
      # trusted network -- agent tokens are bearer credentials.
      - "${GATEWAY_LISTEN_PORT:-8787}:8787"
    networks:
      - plane
    depends_on:
      gateway-migrate:
        # Wait for migrations to COMPLETE, not merely to start. Without the
        # condition the server can boot against a schema that isn't there yet.
        condition: service_completed_successfully

  # Runs migrations to completion, then exits. Keeps schema changes out of the
  # server's startup path, so a failed migration is loud rather than a crash loop.
  gateway-migrate:
    build:
      context: ../server
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache postgresql-client >/dev/null 2>&1
        for f in migrations/0*.sql; do
          case "$$f" in *000_bootstrap*) continue;; esac
          echo "applying $$f"
          PGPASSWORD="$$GATEWAY_DB_PASSWORD" psql -h plane-db -U agent_gw -d gateway \
            -v ON_ERROR_STOP=1 -f "$$f" || exit 1
        done
        echo "migrations applied"
    environment:
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
    networks:
      - plane
    user: root

networks:
  plane:
    # Plane's compose project is named after its directory (plane-app).
    name: ${PLANE_NETWORK:-plane-app_default}
    external: true
